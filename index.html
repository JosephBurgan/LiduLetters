<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lidu Says</title>
<style>
  :root {
    --bg: #f7f5f1;
    --card: #ffffff;
    --text: #1c1c1c;
    --muted: #5a5a5a;
    --accent: #4a6b8a;
    --accent-soft: #e6eef5;
    --border: #e4e0d8;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    padding: 1.25rem;
    max-width: 780px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 1.75rem;
  }
  h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.3rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .search-box {
    position: relative;
    margin-bottom: 1.1rem;
  }
  .search-box input {
    width: 100%;
    padding: 0.9rem 1rem 0.9rem 2.75rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 1rem;
    background: var(--card);
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.5;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    margin-bottom: 1.4rem;
  }
  .filter-btn {
    padding: 0.38rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 0.82rem;
    cursor: pointer;
    color: var(--muted);
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .group-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 1.6rem 0 0.65rem;
    font-weight: 600;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 1.1rem 1.2rem;
    margin-bottom: 0.7rem;
    border: 1px solid var(--border);
  }
  .question {
    font-weight: 600;
    font-size: 1.02rem;
    margin-bottom: 0.45rem;
  }
  .answer {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .meta {
    margin-top: 0.7rem;
    font-size: 0.75rem;
    color: #999;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.6rem;
  }
  .tag {
    font-size: 0.7rem;
    padding: 0.18rem 0.5rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 2.5rem 1rem;
    display: none;
  }
  footer {
    text-align: center;
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: #999;
  }
</style>
</head>
<body>
  <header>
    <h1>Lidu Says</h1>
    <p class="subtitle">A record of answers given through letterboard</p>
  </header>

  <div class="search-box">
    <input type="search" id="search" placeholder="Search questions or topics..." autocomplete="off">
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
  </div>

  <div id="results"></div>
  <div class="empty" id="empty">No matching answers found.</div>

  <footer>Free & always available</footer>

const resultsEl = document.getElementById("results");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const filtersEl = document.getElementById("filters");

const allTopics = [...new Set(data.flatMap(d => d.topics))].sort();
allTopics.forEach(t => {
  const btn = document.createElement("button");
  btn.className = "filter-btn";
  btn.dataset.filter = t;
  btn.textContent = t;
  filtersEl.appendChild(btn);
});

let activeFilter = "all";

function render() {
  const query = searchEl.value.toLowerCase().trim();
  const filtered = data.filter(item => {
    const matchesFilter = activeFilter === "all" || item.topics.includes(activeFilter) || item.event.includes(activeFilter);
    const matchesSearch = !query ||
      item.q.toLowerCase().includes(query) ||
      item.a.toLowerCase().includes(query) ||
      item.topics.some(t => t.toLowerCase().includes(query)) ||
      item.event.toLowerCase().includes(query);
    return matchesFilter && matchesSearch;
  });

  const groups = {};
  filtered.forEach(item => {
    if (!groups[item.event]) groups[item.event] = [];
    groups[item.event].push(item);
  });

  resultsEl.innerHTML = "";
  emptyEl.style.display = filtered.length ? "none" : "block";

  Object.keys(groups).forEach(event => {
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = event;
    resultsEl.appendChild(title);

    groups[event].forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="question">${item.q}</div>
        <div class="answer">${item.a}</div>
        <div class="tags">${item.topics.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      `;
      resultsEl.appendChild(card);
    });
  });
}

filtersEl.addEventListener("click", e => {
  if (!e.target.classList.contains("filter-btn")) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  activeFilter = e.target.dataset.filter;
  render();
});

searchEl.addEventListener("input", render);
render();
</script>
</body>
</html>
