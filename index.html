<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#061018">
<meta name="description" content="Lidu Letters — questions answered through letterboard">
<title>Lidu Letters</title>
<style>
  :root {
    --bg: #061018;
    --bg-2: #0a1a28;
    --card: #0f2436;
    --card-hover: #143049;
    --text: #e8f4ff;
    --muted: #8aa4b8;
    --sonic: #1b9fff;
    --sonic-bright: #4ec3ff;
    --purple: #9b6dff;
    --purple-soft: #c4a8ff;
    --green: #3dff9a;
    --green-soft: #9affc9;
    --border: rgba(75, 180, 255, 0.22);
    --glow: rgba(27, 159, 255, 0.35);
    --radius: 18px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(ellipse 120% 80% at 10% -10%, rgba(155, 109, 255, 0.22), transparent 50%),
      radial-gradient(ellipse 100% 70% at 90% 10%, rgba(27, 159, 255, 0.28), transparent 45%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(61, 255, 154, 0.08), transparent 40%),
      var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }

  .view { display: none; min-height: 100dvh; flex-direction: column; }
  .view.active { display: flex; }

  /* —— Landing —— */
  .landing-header {
    text-align: center;
    padding: 1.4rem 1.2rem 0.6rem;
  }
  .landing-header h1 {
    font-size: clamp(1.85rem, 7vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(120deg, var(--sonic-bright), var(--purple-soft), var(--green-soft));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .landing-header p {
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 0.35rem;
  }

  .bubble-stage {
    flex: 1;
    position: relative;
    min-height: 58vh;
    margin: 0.35rem 0.75rem 0.85rem;
    overflow: hidden;
  }
  .bubble-backdrop {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(4, 12, 20, 0.55);
    z-index: 15;
    border: none;
    padding: 0;
    cursor: pointer;
    animation: fadeDim 0.35s ease both;
  }
  .bubble-stage.has-focus .bubble-backdrop { display: block; }

  .bubble-anchor {
    position: absolute;
    z-index: 1;
    width: fit-content;
    max-width: min(46vw, 168px);
    transition: top 0.45s cubic-bezier(0.22, 1, 0.36, 1), left 0.45s cubic-bezier(0.22, 1, 0.36, 1), right 0.45s cubic-bezier(0.22, 1, 0.36, 1), max-width 0.45s cubic-bezier(0.22, 1, 0.36, 1), width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bubble-anchor.side-left { left: 3%; right: auto; }
  .bubble-anchor.side-right { right: 3%; left: auto; }
  .bubble-anchor.centered {
    z-index: 25;
    top: 2% !important;
    left: 4% !important;
    right: 4% !important;
    width: auto;
    max-width: none;
    max-height: calc(100% - 4%);
    display: flex;
  }

  .speech-bubble {
    position: relative;
    width: fit-content;
    max-width: 100%;
    padding: 0.55rem 0.7rem 0.65rem;
    border-radius: 16px 16px 16px 6px;
    background: linear-gradient(160deg, rgba(20, 55, 90, 0.95), rgba(15, 36, 54, 0.98));
    border: 1px solid var(--border);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255,255,255,0.04) inset;
    cursor: pointer;
    touch-action: manipulation;
    animation: floatIn 0.55s ease both, floatDrift 5.5s ease-in-out infinite;
    will-change: transform;
  }
  .speech-bubble::after {
    content: "";
    position: absolute;
    left: 14px;
    bottom: -8px;
    width: 12px;
    height: 12px;
    background: inherit;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    transform: rotate(45deg);
    border-radius: 0 0 3px 0;
  }
  .bubble-anchor.side-right .speech-bubble {
    border-radius: 16px 16px 6px 16px;
  }
  .bubble-anchor.side-right .speech-bubble::after {
    left: auto;
    right: 14px;
  }
  .bubble-anchor:nth-child(3n+1) .speech-bubble { border-color: rgba(27, 159, 255, 0.45); }
  .bubble-anchor:nth-child(3n+2) .speech-bubble { border-color: rgba(155, 109, 255, 0.45); }
  .bubble-anchor:nth-child(3n) .speech-bubble { border-color: rgba(61, 255, 154, 0.35); }

  .bubble-anchor:nth-child(3n+1) .speech-bubble { animation-duration: 0.55s, 6.2s; animation-delay: 0s, 0s; }
  .bubble-anchor:nth-child(3n+2) .speech-bubble { animation-duration: 0.55s, 5.1s; animation-delay: 0.05s, -1.2s; }
  .bubble-anchor:nth-child(3n) .speech-bubble { animation-duration: 0.55s, 7s; animation-delay: 0.1s, -2.4s; }

  .bubble-anchor.centered .speech-bubble {
    animation: none;
    transform: none;
    width: 100%;
    max-width: none;
    max-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding: 0.9rem 1rem 1.1rem;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 24px var(--glow);
    background: linear-gradient(160deg, #164066, #0f2436);
  }
  .bubble-anchor.centered .speech-bubble::after { display: none; }

  .bubble-q {
    font-weight: 650;
    font-size: 0.82rem;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
    overflow: hidden;
  }
  .bubble-anchor.centered .bubble-q {
    font-size: 1.02rem;
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
  }
  .bubble-a {
    display: none;
    margin-top: 0.65rem;
    padding-top: 0.65rem;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
    line-height: 1.45;
  }
  .bubble-anchor.centered .bubble-a { display: block; }
  .bubble-hint {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.65rem;
    color: var(--sonic-bright);
    opacity: 0.85;
  }
  .bubble-anchor.centered .bubble-hint { display: none; }
  .bubble-more { display: none; margin-top: 0.7rem; }
  .bubble-anchor.centered .bubble-more { display: block; }

  .more-toggle {
    background: none;
    border: none;
    color: var(--purple-soft);
    font-size: 0.78rem;
    cursor: pointer;
    padding: 0.2rem 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .more-panel {
    display: none;
    margin-top: 0.5rem;
    padding: 0.65rem 0.75rem;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.25);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .more-panel.open { display: block; }
  .more-meta { margin-bottom: 0.35rem; }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(10px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes floatDrift {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(2px, -3px); }
    66% { transform: translate(-2px, 2px); }
  }
  @keyframes fadeDim {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .landing-footer {
    padding: 0.75rem 1.1rem calc(1.1rem + var(--safe-bottom));
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    align-items: stretch;
  }

  .btn-main {
    appearance: none;
    border: none;
    border-radius: 999px;
    padding: 0.95rem 1.25rem;
    font-size: 1.02rem;
    font-weight: 700;
    cursor: pointer;
    color: #041018;
    background: linear-gradient(120deg, var(--sonic-bright), var(--green));
    box-shadow: 0 6px 24px var(--glow);
    touch-action: manipulation;
  }
  .btn-main:active { transform: scale(0.98); }

  .btn-ghost {
    appearance: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    padding: 0.65rem 1rem;
    font-size: 0.88rem;
    cursor: pointer;
    touch-action: manipulation;
  }

  /* —— Browse —— */
  .browse-top {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(6, 16, 24, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0.85rem 1rem 0.75rem;
  }
  .browse-nav {
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }
  .browse-nav h2 {
    font-size: 1.15rem;
    font-weight: 750;
    letter-spacing: -0.02em;
    flex: 1;
  }
  .back-btn {
    appearance: none;
    background: rgba(27, 159, 255, 0.12);
    border: 1px solid var(--border);
    color: var(--sonic-bright);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-toggle {
    appearance: none;
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: rgba(27, 159, 255, 0.12);
    border: 1px solid var(--border);
    color: var(--sonic-bright);
    border-radius: 999px;
    padding: 0.42rem 0.75rem 0.42rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 650;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-toggle-label { line-height: 1; }
  .filter-chevron {
    width: 18px;
    height: 18px;
    display: block;
    transition: transform 0.25s ease;
    flex-shrink: 0;
  }
  .browse-top.filters-collapsed .filter-chevron {
    transform: rotate(-90deg);
  }

  .filter-panel {
    overflow: hidden;
    max-height: 280px;
    opacity: 1;
    transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.25s ease;
    margin-top: 0.75rem;
  }
  .browse-top.filters-collapsed .filter-panel {
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    pointer-events: none;
  }

  .sort-label {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  .sort-row {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
  }
  .sort-btn {
    appearance: none;
    border: 1px solid transparent;
    background: linear-gradient(120deg, rgba(27, 159, 255, 0.22), rgba(155, 109, 255, 0.18));
    color: var(--text);
    border-radius: 12px;
    padding: 0.55rem 0.95rem;
    font-size: 0.9rem;
    font-weight: 750;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(78, 195, 255, 0.25);
  }
  .sort-btn.active {
    color: #041018;
    background: linear-gradient(120deg, var(--sonic-bright), var(--purple-soft));
    box-shadow: 0 4px 16px var(--glow);
  }

  .filter-divider {
    height: 1px;
    margin: 0.85rem 0 0.7rem;
    background: linear-gradient(90deg, transparent, rgba(75, 180, 255, 0.35), transparent);
  }

  .chip-label {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }
  .option-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .chip {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(15, 36, 54, 0.65);
    color: var(--muted);
    border-radius: 999px;
    padding: 0.3rem 0.7rem;
    font-size: 0.76rem;
    font-weight: 500;
    cursor: pointer;
  }
  .chip.active {
    border-color: var(--green);
    color: var(--green-soft);
    background: rgba(61, 255, 154, 0.08);
  }

  .browse-body {
    flex: 1;
    padding: 0.85rem 1rem 1.5rem;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .qa-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 0.55rem;
    overflow: hidden;
  }
  .qa-q {
    width: 100%;
    text-align: left;
    appearance: none;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 1rem 1.05rem;
    font-size: 0.98rem;
    font-weight: 650;
    line-height: 1.35;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    touch-action: manipulation;
  }
  .qa-q-text { display: flex; flex-direction: column; gap: 0.25rem; }
  .qa-context {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--muted);
  }
  .qa-q:active { background: var(--card-hover); }
  .qa-chevron {
    flex-shrink: 0;
    color: var(--sonic-bright);
    transition: transform 0.2s;
    font-size: 0.85rem;
    margin-top: 0.15rem;
  }
  .qa-item.open .qa-chevron { transform: rotate(90deg); }
  .qa-body { display: none; padding: 0 1.05rem 1rem; }
  .qa-item.open .qa-body { display: block; }
  .qa-a { font-size: 0.92rem; line-height: 1.5; opacity: 0.92; }
  .qa-meta { margin-top: 0.65rem; font-size: 0.75rem; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.55rem; }
  .tag {
    font-size: 0.68rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: rgba(155, 109, 255, 0.18);
    color: var(--purple-soft);
  }
  .wiki-block {
    margin-top: 0.7rem;
    padding-top: 0.65rem;
    border-top: 1px solid var(--border);
  }

  .browse-loop {
    margin-top: 1.5rem;
    padding: 1.15rem 1rem;
    border-radius: var(--radius);
    border: 1px dashed rgba(27, 159, 255, 0.35);
    text-align: center;
    background: rgba(27, 159, 255, 0.06);
  }
  .browse-loop p {
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 0.85rem;
  }
  .loop-actions { display: flex; flex-direction: column; gap: 0.5rem; }
  .empty { text-align: center; color: var(--muted); padding: 2rem 1rem; }

  /* —— Admin (hash-gated) —— */
  .admin-shell {
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
    padding: 1.25rem 1rem calc(2rem + var(--safe-bottom));
  }
  .admin-shell h1 {
    font-size: 1.4rem;
    margin-bottom: 0.35rem;
  }
  .admin-shell .sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 1.25rem;
  }
  .admin-menu {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
  }
  .admin-menu button, .admin-nav-row button {
    width: 100%;
  }
  .admin-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem;
  }
  .admin-card h2 {
    font-size: 1.05rem;
    margin-bottom: 0.9rem;
  }
  .form-group {
    margin-bottom: 1rem;
    padding: 0.85rem 0.9rem 0.35rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.18);
  }
  .form-group-title {
    font-size: 0.68rem;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--sonic-bright);
    margin-bottom: 0.65rem;
  }
  .form-row { margin-bottom: 0.75rem; }
  .form-row label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  .form-row input, .form-row textarea {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    background: var(--bg-2);
    color: var(--text);
  }
  .form-row textarea { min-height: 88px; resize: vertical; }
  .form-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }
  .btn {
    padding: 0.6rem 1rem;
    border-radius: 10px;
    border: none;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary { background: var(--sonic); color: #041018; font-weight: 700; }
  .btn-secondary { background: rgba(155, 109, 255, 0.2); color: var(--purple-soft); }
  .btn-danger { background: rgba(255, 90, 90, 0.18); color: #ff9b9b; }

  .edit-list { display: flex; flex-direction: column; gap: 0.45rem; }
  .edit-row {
    display: flex;
    gap: 0.5rem;
    align-items: flex-start;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.15);
  }
  .edit-row .info { flex: 1; min-width: 0; }
  .edit-row .q { font-weight: 650; font-size: 0.9rem; }
  .edit-row .meta { color: var(--muted); font-size: 0.75rem; margin-top: 0.2rem; }
  .edit-row .actions { display: flex; flex-direction: column; gap: 0.3rem; }
  .edit-row .actions button {
    appearance: none;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--sonic-bright);
    border-radius: 8px;
    padding: 0.3rem 0.55rem;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .edit-row .actions .del { color: #ff9b9b; }

  .admin-panel-view { display: none; }
  .admin-panel-view.active { display: block; }

  @media (min-width: 700px) {
    .bubble-stage { max-width: 720px; margin-left: auto; margin-right: auto; width: 100%; }
    .landing-footer { max-width: 420px; margin: 0 auto; width: 100%; }
    .bubble-anchor { max-width: min(38vw, 200px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .speech-bubble { animation: floatIn 0.4s ease both; }
    .bubble-anchor { transition-duration: 0.01ms; }
  }
</style>
</head>
<body>

  <!-- LANDING -->
  <section class="view active" id="viewLanding" aria-label="Featured questions">
    <header class="landing-header">
      <h1>Lidu Letters</h1>
      <p>Tap a bubble to peek at an answer</p>
    </header>
    <div class="bubble-stage" id="bubbleStage" aria-live="polite">
      <button type="button" class="bubble-backdrop" id="bubbleBackdrop" aria-label="Close bubble"></button>
    </div>
    <div class="landing-footer">
      <button class="btn-main" id="browseBtn" type="button">Browse all questions</button>
      <button class="btn-ghost" id="reshuffleBtn" type="button">Show different bubbles</button>
    </div>
  </section>

  <!-- BROWSE -->
  <section class="view" id="viewBrowse" aria-label="Question list">
    <div class="browse-top" id="browseTop">
      <div class="browse-nav">
        <button class="back-btn" id="backHome" type="button">← Bubbles</button>
        <h2>Questions</h2>
        <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="true" aria-controls="filterPanel" title="Hide filters">
          <span class="filter-toggle-label">Filters</span>
          <svg class="filter-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
          </svg>
        </button>
      </div>
      <div class="filter-panel" id="filterPanel">
        <div class="sort-label">Sort by</div>
        <div class="sort-row" role="tablist" aria-label="Sort by">
          <button class="sort-btn active" data-mode="topic" type="button">Topic</button>
          <button class="sort-btn" data-mode="event" type="button">Event</button>
          <button class="sort-btn" data-mode="date" type="button">Date</button>
        </div>
        <div class="filter-divider"></div>
        <div class="chip-label" id="chipLabel">Filter · Topic</div>
        <div class="option-chips" id="optionChips"></div>
      </div>
    </div>

    <div class="browse-body">
      <div id="qaList"></div>
      <div class="empty" id="browseEmpty" style="display:none">Nothing in this filter yet.</div>
      <div class="browse-loop">
        <p>Want a different angle?</p>
        <div class="loop-actions">
          <button class="btn-main" id="changeFilterBtn" type="button">Change topic / filter</button>
          <button class="btn-ghost" id="backBubblesBtn" type="button">Back to speech bubbles</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ADMIN (only via #admin) -->
  <section class="view" id="viewAdmin" aria-label="Admin">
    <div class="admin-shell">
      <h1>Admin</h1>
      <p class="sub">Add and edit letterboard entries. Public visitors never see this screen.</p>

      <div class="admin-panel-view active" id="adminMenu">
        <div class="admin-menu">
          <button class="btn-main" type="button" data-admin="add">Add entry</button>

function migrateItem(d) {
  const item = { more: "", location: "", event: "", topics: [], ...d };
  if (!item.location && item.event && item.event.includes(" · ")) {
    const parts = item.event.split(" · ");
    item.location = parts[0].trim();
    item.event = parts.slice(1).join(" · ").trim();
  }
  // Refresh vague legacy titles from bundled defaults
  const fresh = defaultData.find(x => x.id === item.id);
  if (fresh && (/final message/i.test(item.q || "") || item.q === "Message")) {
    item.q = fresh.q;
    if (!item.more) item.more = fresh.more;
    if (!item.location) item.location = fresh.location;
    if (!item.event || item.event.includes(" · ")) item.event = fresh.event;
  }
  return item;
}

const stored = localStorage.getItem("liduData");
let data = stored ? JSON.parse(stored).map(migrateItem) : defaultData.map(d => ({ ...d }));
if (!Array.isArray(data) || data.length === 0) data = defaultData.map(d => ({ ...d }));

let nextId = Math.max(0, ...data.map(d => d.id)) + 1;
let editingId = null;
let sortMode = "topic";
let activeOption = "all";
let filtersCollapsed = false;
let centeredId = null;

const viewLanding = document.getElementById("viewLanding");
const viewBrowse = document.getElementById("viewBrowse");
const viewAdmin = document.getElementById("viewAdmin");
const bubbleStage = document.getElementById("bubbleStage");
const qaList = document.getElementById("qaList");
const optionChips = document.getElementById("optionChips");
const browseEmpty = document.getElementById("browseEmpty");
const browseTop = document.getElementById("browseTop");
const filterToggle = document.getElementById("filterToggle");
const chipLabel = document.getElementById("chipLabel");
const formTitle = document.getElementById("formTitle");
const saveBtn = document.getElementById("saveBtn");
const cancelEdit = document.getElementById("cancelEdit");

function saveData() {
  localStorage.setItem("liduData", JSON.stringify(data));
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatContext(item) {
  const bits = [item.location, item.event, item.date].filter(Boolean);
  return bits.join(" · ");
}

function isAdminHash() {
  return (location.hash || "").replace(/^#/, "").split("?")[0] === "admin";
}

function showView(name) {
  viewLanding.classList.toggle("active", name === "landing");
  viewBrowse.classList.toggle("active", name === "browse");
  viewAdmin.classList.toggle("active", name === "admin");
  window.scrollTo(0, 0);
}

function showAdminPanel(id) {
  ["adminMenu", "adminAdd", "adminEditList"].forEach(pid => {
    document.getElementById(pid).classList.toggle("active", pid === id);
  });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function bubbleLayout(count) {
  // Two safe columns — left/right inset handled in CSS so nothing clips
  const presets = [
    [
      {t:4, side:"left"}, {t:6, side:"right"},
      {t:28, side:"left"}, {t:32, side:"right"},
      {t:52, side:"left"}, {t:56, side:"right"}
    ],
    [
      {t:5, side:"right"}, {t:8, side:"left"},
      {t:30, side:"right"}, {t:34, side:"left"},
      {t:54, side:"right"}, {t:58, side:"left"}
    ],
    [
      {t:3, side:"left"}, {t:10, side:"right"},
      {t:26, side:"left"}, {t:36, side:"right"},
      {t:50, side:"left"}, {t:55, side:"right"}
    ]
  ];
  return presets[Math.floor(Math.random() * presets.length)].slice(0, count);
}

function clearCentered(animateBack = true) {
  const current = bubbleStage.querySelector(".bubble-anchor.centered");
  if (!current) {
    bubbleStage.classList.remove("has-focus");
    centeredId = null;
    return;
  }
  const homeTop = current.dataset.homeTop;
  const side = current.dataset.side || "left";
  current.classList.remove("centered");
  current.style.top = homeTop + "%";
  current.style.left = "";
  current.style.right = "";
  current.classList.add(side === "right" ? "side-right" : "side-left");
  const bubble = current.querySelector(".speech-bubble");
  if (bubble) bubble.scrollTop = 0;
  const panel = current.querySelector(".more-panel");
  const toggle = current.querySelector(".more-toggle");
  if (panel) panel.classList.remove("open");
  if (toggle) toggle.textContent = "More details";
  bubbleStage.classList.remove("has-focus");
  centeredId = null;
}

function centerBubble(anchor) {
  anchor.classList.remove("side-left", "side-right");
  anchor.classList.add("centered");
  anchor.style.top = "2%";
  anchor.style.left = "";
  anchor.style.right = "";
  const bubble = anchor.querySelector(".speech-bubble");
  if (bubble) bubble.scrollTop = 0;
  bubbleStage.classList.add("has-focus");
  centeredId = Number(anchor.dataset.id);
}

function bindBubbleGesture(anchor) {
  const bubble = anchor.querySelector(".speech-bubble");
  let startX = 0;
  let startY = 0;
  let moved = false;
  let scrolled = false;

  bubble.addEventListener("scroll", () => { scrolled = true; }, { passive: true });

  bubble.addEventListener("pointerdown", (e) => {
    startX = e.clientX;
    startY = e.clientY;
    moved = false;
    scrolled = false;
  });

  bubble.addEventListener("pointermove", (e) => {
    if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) moved = true;
  });

  bubble.addEventListener("pointerup", (e) => {
    // Keep interactive controls tappable without dismissing
    if (e.target.closest(".more-toggle") || e.target.closest(".more-panel")) return;
    const isOpen = anchor.classList.contains("centered");
    if (isOpen) {
      // Tap (not a scroll/drag) closes the window
      if (!moved && !scrolled) clearCentered(true);
      return;
    }
    if (moved) return;
    clearCentered(true);
    requestAnimationFrame(() => centerBubble(anchor));
  });
}

function renderBubbles() {
  clearCentered(false);
  const picks = shuffle(data).slice(0, Math.min(6, data.length));
  const positions = bubbleLayout(picks.length);
  const backdrop = document.getElementById("bubbleBackdrop");
  bubbleStage.innerHTML = "";
  if (backdrop) bubbleStage.appendChild(backdrop);

  picks.forEach((item, i) => {
    const pos = positions[i] || { t: 8 + i * 12, side: i % 2 ? "right" : "left" };
    const anchor = document.createElement("div");
    const side = pos.side === "right" ? "right" : "left";
    anchor.className = "bubble-anchor " + (side === "right" ? "side-right" : "side-left");
    anchor.style.top = pos.t + "%";
    anchor.dataset.homeTop = String(pos.t);
    anchor.dataset.side = side;
    anchor.dataset.id = item.id;

    const moreBody = item.more
      ? `<div class="more-meta">${escapeHtml(item.more)}</div>`
      : `<div class="more-meta">${escapeHtml(formatContext(item))}</div>
         ${(item.topics || []).length ? `<div class="tags">${item.topics.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}`;

    anchor.innerHTML = `
      <article class="speech-bubble" style="animation-delay: ${i * 0.07}s, ${-i * 0.8}s">
        <div class="bubble-q">${escapeHtml(item.q)}</div>
        <span class="bubble-hint">Tap for answer</span>
        <div class="bubble-a">${escapeHtml(item.a)}</div>
        <div class="bubble-more">
          <button type="button" class="more-toggle" data-more="${item.id}">More details</button>
          <div class="more-panel" id="more-${item.id}">${moreBody}</div>
        </div>
      </article>
    `;

    bindBubbleGesture(anchor);
    bubbleStage.appendChild(anchor);
  });
}

document.getElementById("bubbleBackdrop").addEventListener("click", () => clearCentered(true));

bubbleStage.addEventListener("click", (e) => {
  const toggle = e.target.closest(".more-toggle");
  if (!toggle) return;
  e.stopPropagation();
  const panel = document.getElementById("more-" + toggle.dataset.more);
  if (!panel) return;
  panel.classList.toggle("open");
  toggle.textContent = panel.classList.contains("open") ? "Hide details" : "More details";
});

function optionsForMode() {
  if (sortMode === "topic") {
    return ["all", ...[...new Set(data.flatMap(d => d.topics || []))].sort()];
  }
  if (sortMode === "event") {
    return ["all", ...[...new Set(data.map(d => d.event).filter(Boolean))].sort()];
  }
  return ["all", ...[...new Set(data.map(d => d.date).filter(Boolean))].sort().reverse()];
}

function renderChips() {
  const opts = optionsForMode();
  if (!opts.includes(activeOption)) activeOption = "all";
  chipLabel.textContent = "Filter · " + (sortMode === "topic" ? "Topic" : sortMode === "event" ? "Event" : "Date");
  optionChips.innerHTML = "";
  opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip" + (opt === activeOption ? " active" : "");
    btn.textContent = opt === "all" ? "All" : opt;
    btn.addEventListener("click", () => {
      activeOption = opt;
      renderChips();
      renderList();
    });
    optionChips.appendChild(btn);
  });
}

function filteredList() {
  return data.filter(item => {
    if (activeOption === "all") return true;
    if (sortMode === "topic") return (item.topics || []).includes(activeOption);
    if (sortMode === "event") return item.event === activeOption;
    return item.date === activeOption;
  }).sort((a, b) => {
    if (sortMode === "date") return (b.date || "").localeCompare(a.date || "");
    return a.q.localeCompare(b.q);
  });
}

function renderList() {
  const items = filteredList();
  qaList.innerHTML = "";
  browseEmpty.style.display = items.length ? "none" : "block";

  items.forEach(item => {
    const wrap = document.createElement("div");
    wrap.className = "qa-item";
    const ctx = formatContext(item);
    wrap.innerHTML = `
      <button type="button" class="qa-q" aria-expanded="false">
        <span class="qa-q-text">
          <span>${escapeHtml(item.q)}</span>
          ${ctx ? `<span class="qa-context">${escapeHtml(ctx)}</span>` : ""}
        </span>
        <span class="qa-chevron" aria-hidden="true">›</span>
      </button>
      <div class="qa-body">
        <div class="qa-a">${escapeHtml(item.a)}</div>
        <div class="qa-meta">${escapeHtml(ctx)}</div>
        ${(item.topics || []).length ? `<div class="tags">${item.topics.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
        <div class="wiki-block">
          <button type="button" class="more-toggle wiki-toggle">More details</button>
          <div class="more-panel wiki-panel">
            ${item.more
              ? `<div>${escapeHtml(item.more)}</div>`
              : `<p>Optional notes, links, and related context can live here.</p>`}
          </div>
        </div>
      </div>
    `;

    const qBtn = wrap.querySelector(".qa-q");
    qBtn.addEventListener("click", () => {
      const open = wrap.classList.toggle("open");
      qBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });

    const wikiToggle = wrap.querySelector(".wiki-toggle");
    const wikiPanel = wrap.querySelector(".wiki-panel");
    wikiToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      wikiPanel.classList.toggle("open");
      wikiToggle.textContent = wikiPanel.classList.contains("open") ? "Hide details" : "More details";
    });

    qaList.appendChild(wrap);
  });
}

function setFiltersCollapsed(collapsed) {
  filtersCollapsed = collapsed;
  browseTop.classList.toggle("filters-collapsed", collapsed);
  filterToggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
  filterToggle.title = collapsed ? "Show filters" : "Hide filters";
  const label = filterToggle.querySelector(".filter-toggle-label");
  if (label) label.textContent = "Filters";
}

function openBrowse() {
  showView("browse");
  renderChips();
  renderList();
}

function openFiltersFromLoop() {
  setFiltersCollapsed(false);
  showView("browse");
  renderChips();
  renderList();
  requestAnimationFrame(() => {
    browseTop.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

document.getElementById("browseBtn").addEventListener("click", openBrowse);
document.getElementById("reshuffleBtn").addEventListener("click", renderBubbles);
document.getElementById("backHome").addEventListener("click", () => showView("landing"));

filterToggle.addEventListener("click", () => setFiltersCollapsed(!filtersCollapsed));

document.querySelectorAll(".sort-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    sortMode = btn.dataset.mode;
    activeOption = "all";
    renderChips();
    renderList();
  });
});

      </div>
      <div class="actions">
        <button type="button" data-edit="${item.id}">Edit</button>
        <button type="button" class="del" data-del="${item.id}">Delete</button>
      </div>
    `;
    list.appendChild(row);
  });
}

document.querySelectorAll("[data-admin]").forEach(btn => {
  btn.addEventListener("click", () => {
    const dest = btn.dataset.admin;
    if (dest === "menu") {
      clearForm();
      showAdminPanel("adminMenu");
    } else if (dest === "add") {
      clearForm();
      showAdminPanel("adminAdd");
    } else if (dest === "edit-list") {
      renderEditList();
      showAdminPanel("adminEditList");
    }
  });
});

document.getElementById("adminExit").addEventListener("click", () => {
  history.replaceState(null, "", location.pathname + location.search);
  showView("landing");
});

document.getElementById("editList").addEventListener("click", (e) => {
  const editId = Number(e.target.dataset.edit);
  const delId = Number(e.target.dataset.del);
  if (editId) {
    const item = data.find(d => d.id === editId);
    if (!item) return;
    fillForm(item);
    showAdminPanel("adminAdd");
  }
  if (delId) {
    const confirmText = prompt('Type "delete" to confirm removal');
    if (confirmText === "delete") {
      data = data.filter(d => d.id !== delId);
      saveData();
      renderEditList();
      renderBubbles();
    }
  }
});

saveBtn.addEventListener("click", () => {
  const event = document.getElementById("adminEvent").value.trim();
  const q = document.getElementById("adminQuestion").value.trim();
  const a = document.getElementById("adminAnswer").value.trim();
  const date = document.getElementById("adminDate").value;
  const locationName = document.getElementById("adminLocation").value.trim();
  const tags = document.getElementById("adminTags").value.split(",").map(t => t.trim()).filter(Boolean);
  const more = document.getElementById("adminMore").value.trim();

  if (!q || !a) {
    alert("Please fill question and answer.");
    return;
  }

  if (editingId) {
    const item = data.find(d => d.id === editingId);
    if (item) Object.assign(item, { event, q, a, date, location: locationName, topics: tags, more });
  } else {
    data.push({ id: nextId++, q, a, topics: tags, date, event, location: locationName, more });
  }

  saveData();
  clearForm();
  showAdminPanel("adminMenu");
  renderBubbles();
  alert("Saved.");
});

cancelEdit.addEventListener("click", () => {
  clearForm();
  showAdminPanel("adminEditList");
  renderEditList();
});

function routeFromHash() {
  if (isAdminHash()) {
    showView("admin");
    showAdminPanel("adminMenu");
    clearForm();
  } else if (viewAdmin.classList.contains("active")) {
    showView("landing");
  }
}

window.addEventListener("hashchange", routeFromHash);

// Prefer bundled answers over stale empty localStorage from early drafts
if (stored) {
  try {
    const parsed = JSON.parse(stored);
    if (Array.isArray(parsed) && parsed.length >= defaultData.length) {
      // keep migrated local edits
      saveData();
    }
  } catch (_) {}
}

routeFromHash();
if (!isAdminHash()) renderBubbles();
else renderBubbles();
</script>
</body>
</html>
