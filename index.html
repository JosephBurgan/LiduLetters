<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lidu Letters</title>
<style>
  :root {
    --bg: #f7f5f2;
    --card: #ffffff;
    --text: #1c1b19;
    --muted: #6b6560;
    --accent: #4a5d6a;
    --accent-soft: #e8eef1;
    --border: #e4e0d9;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    padding: 1.25rem;
    max-width: 740px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 1.75rem;
  }
  h1 {
    font-size: 1.7rem;
    font-weight: 650;
    letter-spacing: -0.025em;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.92rem;
  }
  .search-box {
    position: relative;
    margin-bottom: 1rem;
  }
  .search-box input {
    width: 100%;
    padding: 0.85rem 1rem 0.85rem 2.6rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 1rem;
    background: var(--card);
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: "⌕";
    position: absolute;
    left: 1.05rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.1rem;
    color: var(--muted);
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.5rem;
  }
  .filter-btn {
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 0.82rem;
    cursor: pointer;
    color: var(--muted);
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .group {
    margin-bottom: 0.9rem;
  }
  .group-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 0.2rem;
    cursor: pointer;
    user-select: none;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .group-header .arrow {
    transition: transform 0.15s;
    font-size: 0.7rem;
  }
  .group.collapsed .arrow { transform: rotate(-90deg); }
  .group.collapsed .group-body { display: none; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 1.1rem 1.2rem;
    margin-bottom: 0.6rem;
    border: 1px solid var(--border);
  }
  .question {
    font-weight: 600;
    font-size: 1.02rem;
    margin-bottom: 0.4rem;
  }
  .answer {
    color: var(--muted);
    font-size: 0.94rem;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.75rem;
  }
  .tag {
    font-size: 0.7rem;
    padding: 0.18rem 0.5rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 2.5rem 1rem;
    display: none;
  }
  footer {
    text-align: center;
    margin-top: 2.5rem;
    font-size: 0.78rem;
    color: #9a9590;
  }
  .admin-toggle {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .admin-panel {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .admin-panel.open { display: block; }
  .admin-panel h2 {
    font-size: 1rem;
    margin-bottom: 1rem;
  }
  .form-row {
    margin-bottom: 0.75rem;
  }
  .form-row label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  .form-row input, .form-row textarea {
    width: 100%;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .form-row textarea { min-height: 70px; resize: vertical; }
  .form-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .btn {
    padding: 0.55rem 1rem;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-secondary {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .admin-list {
    margin-top: 1.5rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
  .admin-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .admin-item .q { font-weight: 500; }
  .admin-actions {
    display: flex;
    gap: 0.35rem;
    flex-shrink: 0;
  }
  .btn-edit, .btn-delete {
    background: none;
    border: 1px solid #d4c8c0;
    color: #8a6a5a;
    padding: 0.25rem 0.55rem;
    border-radius: 6px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .btn-edit {
    border-color: var(--border);
    color: var(--accent);
  }
</style>
</head>
<body>
  <header>
    <h1>Lidu Letters</h1>
    <p class="subtitle">A record of answers given through letterboard</p>
  </header>

  <div class="admin-panel" id="adminPanel">
    <h2 id="formTitle">Add New Answer</h2>
    <div class="form-row">
      <label>Date (YYYY-MM-DD)</label>
      <input type="date" id="adminDate">
    </div>
    <div class="form-row">
      <label>Location / Event</label>
      <input type="text" id="adminEvent" placeholder="e.g. Home Session">
    </div>
    <div class="form-row">
      <label>Question</label>
      <input type="text" id="adminQuestion" placeholder="The question asked">
    </div>
    <div class="form-row">
      <label>Answer</label>
      <textarea id="adminAnswer" placeholder="Lidu's answer"></textarea>
    </div>
    <div class="form-row">
      <label>Tags (comma separated)</label>
      <input type="text" id="adminTags" placeholder="Spiritual, Guides, Teachers">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="addBtn">Add Answer</button>
      <button class="btn btn-secondary" id="cancelEdit" style="display:none">Cancel Edit</button>
      <button class="btn btn-secondary" id="exportBtn">Export Data</button>
      <button class="btn btn-secondary" id="resetBtn">Reset Samples</button>
    </div>

    <div class="admin-list" id="adminList"></div>
  </div>

  <div class="search-box">
    <input type="search" id="search" placeholder="Search questions or topics..." autocomplete="off">
  </div>

  <div class="filters" id="topic-filters">
    <button class="filter-btn active" data-filter="all">All</button>
  </div>

  <div id="results"></div>
  <div class="empty" id="empty">No matching answers found.</div>

  <footer>Last updated: July 2026</footer>

  <button class="admin-toggle" id="adminToggle" title="Admin">+</button>

<script>
const defaultData = [
  {
    id: 1,
    q: "What is collective consciousness?",
    a: "It is the shared field of awareness that connects all beings. We can feel each other there even when bodies cannot speak.",
    topics: ["Collective Consciousness", "Spiritual"],
    date: "2025-03-12",
    event: "Home Session"
  },
  {
    id: 2,
    q: "Who are the guides?",
    a: "They are teachers from higher planes who help us remember who we really are. They speak through feeling more than words.",
    topics: ["Guides", "Teachers", "Spiritual"],
    date: "2025-03-12",
    event: "Home Session"
  },
  {
    id: 3,
    q: "Why does it take so long to answer?",
    a: "The letterboard is slow because each letter is chosen carefully. The thoughts come fast. The body is the bottleneck.",
    topics: ["Communication", "Letterboard"],
    date: "2025-06-04",
    event: "Family Conversation"
  },
  {
    id: 4,
    q: "Do you feel lonely when people cannot hear you?",
    a: "Sometimes the body feels lonely. The soul does not. The soul is always connected.",
    topics: ["Emotions", "Spiritual"],
    date: "2025-06-04",
    event: "Family Conversation"
  },
  {
    id: 5,
    q: "What do the teachers want us to learn?",
    a: "To remember that love is the real language. Everything else is practice.",
    topics: ["Teachers", "Spiritual"],
    date: "2025-03-12",
    event: "Home Session"
  },
  {
    id: 6,
    q: "Is telepathy real?",
    a: "Yes. Many of us use it every day. Words are only one way to talk.",
    topics: ["Telepathy", "Communication"],
    date: "2025-07-20",
    event: "Inspired by Telepathy Tapes"
  }
];

let data = JSON.parse(localStorage.getItem("liduData")) || [...defaultData];
let nextId = Math.max(...data.map(d => d.id), 0) + 1;
let activeFilter = "all";
let editingId = null;

const lastDate = localStorage.getItem("liduLastDate") || "";
const lastEvent = localStorage.getItem("liduLastEvent") || "";

const resultsEl = document.getElementById("results");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const topicFiltersEl = document.getElementById("topic-filters");
const adminPanel = document.getElementById("adminPanel");
const adminToggle = document.getElementById("adminToggle");
const formTitle = document.getElementById("formTitle");
const addBtn = document.getElementById("addBtn");
const cancelEdit = document.getElementById("cancelEdit");

document.getElementById("adminDate").value = lastDate;
document.getElementById("adminEvent").value = lastEvent;

function saveData() {
  localStorage.setItem("liduData", JSON.stringify(data));
}

function buildFilters() {
  const allTopics = [...new Set(data.flatMap(d => d.topics))].sort();
  topicFiltersEl.innerHTML = `<button class="filter-btn active" data-filter="all">All</button>`;
  allTopics.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.dataset.filter = t;
    btn.textContent = t;
    topicFiltersEl.appendChild(btn);
  });
}

function render() {
  const query = searchEl.value.toLowerCase().trim();
  const isSearching = query.length > 0 || activeFilter !== "all";

  const filtered = data.filter(item => {
    const matchesFilter = activeFilter === "all" || item.topics.includes(activeFilter);
    const matchesSearch = !query || 
      item.q.toLowerCase().includes(query) || 
      item.a.toLowerCase().includes(query) ||
      item.topics.some(t => t.toLowerCase().includes(query)) ||
      item.event.toLowerCase().includes(query) ||
      item.date.includes(query);
    return matchesFilter && matchesSearch;
  });

  const groups = {};
  filtered.forEach(item => {
    const key = `${item.date} · ${item.event}`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(item);
  });

  resultsEl.innerHTML = "";
  emptyEl.style.display = filtered.length ? "none" : "block";

  const sortedKeys = Object.keys(groups).sort().reverse();

  sortedKeys.forEach(key => {
    const group = document.createElement("div");
    group.className = "group";

    const header = document.createElement("div");
    header.className = "group-header";
    if (!isSearching) {
      header.innerHTML = `<span class="arrow">▼</span> ${key}`;
      header.onclick = () => group.classList.toggle("collapsed");
    } else {
      header.style.cursor = "default";
      header.textContent = key;
    }
    group.appendChild(header);

    const body = document.createElement("div");
    body.className = "group-body";

    groups[key].forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="question">${item.q}</div>
        <div class="answer">${item.a}</div>
        <div class="tags">${item.topics.map(t => `<span class="tag">${t}</span>`).join("")}</div>
      `;
      body.appendChild(card);
    });

    group.appendChild(body);
    resultsEl.appendChild(group);
  });

  renderAdminList();
}

function renderAdminList() {
  const list = document.getElementById("adminList");
  list.innerHTML = "<strong style='font-size:0.85rem'>Current entries</strong>";
  data.slice().reverse().forEach(item => {
    const row = document.createElement("div");
    row.className = "admin-item";
    row.innerHTML = `
      <div>
        <div class="q">${item.q}</div>
        <div style="color:var(--muted);font-size:0.8rem">${item.date} · ${item.event}</div>
      </div>
      <div class="admin-actions">
        <button class="btn-edit" data-id="${item.id}">Edit</button>
        <button class="btn-delete" data-id="${item.id}">Delete</button>
      </div>
    `;
    list.appendChild(row);
  });
}

function clearForm(keepDateEvent = true) {
  if (!keepDateEvent) {
    document.getElementById("adminDate").value = "";
    document.getElementById("adminEvent").value = "";
  }
  document.getElementById("adminQuestion").value = "";
  document.getElementById("adminAnswer").value = "";
  document.getElementById("adminTags").value = "";
  editingId = null;
  formTitle.textContent = "Add New Answer";
  addBtn.textContent = "Add Answer";
  cancelEdit.style.display = "none";
}

topicFiltersEl.addEventListener("click", e => {
  if (!e.target.classList.contains("filter-btn")) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  activeFilter = e.target.dataset.filter;
  render();
});

searchEl.addEventListener("input", render);

adminToggle.addEventListener("click", () => {
  adminPanel.classList.toggle("open");
});

addBtn.addEventListener("click", () => {
  const date = document.getElementById("adminDate").value;
  const event = document.getElementById("adminEvent").value.trim();
  const q = document.getElementById("adminQuestion").value.trim();
  const a = document.getElementById("adminAnswer").value.trim();
  const tags = document.getElementById("adminTags").value.split(",").map(t => t.trim()).filter(Boolean);

  if (!date || !event || !q || !a) {
    alert("Please fill date, event, question and answer.");
    return;
  }

  if (editingId) {
    const item = data.find(d => d.id === editingId);
    if (item) {
      item.date = date;
      item.event = event;
      item.q = q;
      item.a = a;
      item.topics = tags;
    }
  } else {
    data.push({ id: nextId++, q, a, topics: tags, date, event });
  }

  saveData();
  localStorage.setItem("liduLastDate", date);
  localStorage.setItem("liduLastEvent", event);

  clearForm(true);
  document.getElementById("adminDate").value = date;
  document.getElementById("adminEvent").value = event;

  buildFilters();
  render();
});

cancelEdit.addEventListener("click", () => {
  clearForm(true);
  document.getElementById("adminDate").value = localStorage.getItem("liduLastDate") || "";
  document.getElementById("adminEvent").value = localStorage.getItem("liduLastEvent") || "";
});

document.getElementById("adminList").addEventListener("click", e => {
  const id = Number(e.target.dataset.id);
  if (!id) return;

  if (e.target.classList.contains("btn-delete")) {
    const confirmText = prompt('Type "delete" to confirm removal');
    if (confirmText === "delete") {
      data = data.filter(d => d.id !== id);
      saveData();
      buildFilters();
      render();
    }
  }

  if (e.target.classList.contains("btn-edit")) {
    const item = data.find(d => d.id === id);
    if (!item) return;
    editingId = id;
    document.getElementById("adminDate").value = item.date;
    document.getElementById("adminEvent").value = item.event;
    document.getElementById("adminQuestion").value = item.q;
    document.getElementById("adminAnswer").value = item.a;
    document.getElementById("adminTags").value = item.topics.join(", ");
    formTitle.textContent = "Edit Answer";
    addBtn.textContent = "Save Changes";
    cancelEdit.style.display = "inline-block";
    adminPanel.classList.add("open");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const str = JSON.stringify(data, null, 2);
  navigator.clipboard.writeText(str).then(() => alert("Data copied to clipboard."));
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Reset to the original sample questions? This will erase current local changes.")) {
    data = [...defaultData];
    nextId = Math.max(...data.map(d => d.id), 0) + 1;
    saveData();
    clearForm(false);
    buildFilters();
    render();
  }
});

buildFilters();
render();
</script>
</body>
</html>
