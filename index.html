<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lidu Letters</title>
<style>
  :root {
    --bg: #f7f5f2;
    --card: #ffffff;
    --text: #1c1b19;
    --muted: #6b6560;
    --accent: #4a5d6a;
    --accent-soft: #e8eef1;
    --border: #e4e0d9;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    padding: 1.25rem;
    max-width: 740px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 1.75rem;
  }
  h1 {
    font-size: 1.7rem;
    font-weight: 650;
    letter-spacing: -0.025em;
    margin-bottom: 0.25rem;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.92rem;
  }
  .search-box {
    position: relative;
    margin-bottom: 1rem;
  }
  .search-box input {
    width: 100%;
    padding: 0.85rem 1rem 0.85rem 2.6rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 1rem;
    background: var(--card);
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box::before {
    content: "⌕";
    position: absolute;
    left: 1.05rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.1rem;
    color: var(--muted);
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.5rem;
  }
  .filter-btn {
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 0.82rem;
    cursor: pointer;
    color: var(--muted);
  }
  .filter-btn.active, .filter-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .group {
    margin-bottom: 0.9rem;
  }
  .group-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.55rem 0.2rem;
    cursor: pointer;
    user-select: none;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .group-header .arrow {
    transition: transform 0.15s;
    font-size: 0.7rem;
  }
  .group.collapsed .arrow { transform: rotate(-90deg); }
  .group.collapsed .group-body { display: none; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 1.1rem 1.2rem;
    margin-bottom: 0.6rem;
    border: 1px solid var(--border);
  }
  .question {
    font-weight: 600;
    font-size: 1.02rem;
    margin-bottom: 0.4rem;
  }
  .answer {
    color: var(--muted);
    font-size: 0.94rem;
  }
  .meta {
    font-size: 0.75rem;
    color: #9a9590;
    margin-top: 0.6rem;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    margin-top: 0.5rem;
  }
  .tag {
    font-size: 0.7rem;
    padding: 0.18rem 0.5rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 2.5rem 1rem;
  }
  footer {
    text-align: center;
    margin-top: 2.5rem;
    font-size: 0.78rem;
    color: #9a9590;
  }
  .admin-toggle {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .admin-panel {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .admin-panel.open { display: block; }
  .admin-panel h2 {
    font-size: 1rem;
    margin-bottom: 1rem;
  }
  .form-row {
    margin-bottom: 0.75rem;
  }
  .form-row label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  .form-row input, .form-row textarea {
    width: 100%;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  .form-row textarea { min-height: 70px; resize: vertical; }
  .form-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .btn {
    padding: 0.55rem 1rem;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-secondary {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .admin-list {
    margin-top: 1.5rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
  .admin-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .admin-item .q { font-weight: 500; }
  .admin-actions {
    display: flex;
    gap: 0.35rem;
    flex-shrink: 0;
  }
  .btn-edit, .btn-delete {
    background: none;
    border: 1px solid #d4c8c0;
    color: #8a6a5a;
    padding: 0.25rem 0.55rem;
    border-radius: 6px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .btn-edit {
    border-color: var(--border);
    color: var(--accent);
  }
</style>
</head>
<body>
  <header>
    <h1>Lidu Letters</h1>
    <p class="subtitle">A record of answers given through letterboard</p>
  </header>

  <div class="admin-panel" id="adminPanel">
    <h2 id="formTitle">Add New Answer</h2>
    <div class="form-row">
      <label>Date (YYYY-MM-DD)</label>
      <input type="date" id="adminDate">
    </div>
    <div class="form-row">
      <label>Location / Event</label>
      <input type="text" id="adminEvent" placeholder="e.g. Sedona Telepathy Training">
    </div>
    <div class="form-row">
      <label>Question</label>
      <input type="text" id="adminQuestion" placeholder="The question asked">
    </div>
    <div class="form-row">
      <label>Answer</label>
      <textarea id="adminAnswer" placeholder="Lidu's answer"></textarea>
    </div>
    <div class="form-row">
      <label>Tags (comma separated)</label>
      <input type="text" id="adminTags" placeholder="Telepathy, Teachers, Hill">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="addBtn">Add Answer</button>
      <button class="btn btn-secondary" id="cancelEdit" style="display:none">Cancel Edit</button>
      <button class="btn btn-secondary" id="exportBtn">Export Data</button>
    </div>

    <div class="admin-list" id="adminList"></div>
  </div>

  <div class="search-box">
    <input type="search" id="search" placeholder="Search questions or topics..." autocomplete="off">
  </div>

  <div class="filters" id="topic-filters">
    <button class="filter-btn active" data-filter="all">All</button>
  </div>

  <div id="results"></div>
  <div class="empty" id="empty">No answers yet.</div>

  <footer>Last updated: July 2026</footer>

  <button class="admin-toggle" id="adminToggle" title="Admin">+</button>

<script>
const defaultData = [
  // Park City · Sensus · 2026-07-12
  {id:1, q:"Who is The Lady?", a:"Teachers in the universal library intervene and she is one that has been helping humanity for thousands of years to help evolution of love and you can ask her to appear. Then people see her in real life.", topics:["Teachers","The Lady"], date:"2026-07-12", event:"Park City · Sensus"},
  {id:2, q:"What would Lidu like us to know?", a:"You are so a telepathic being and it is moving to us when you want to elevate your consciousness. To elevate you all need to remember that your energy is the start of your experience. You sense the world through energetic filters that can be removed to experience more telepathically. You are already telepathic.", topics:["Telepathy","Consciousness"], date:"2026-07-12", event:"Park City · Sensus"},
  {id:3, q:"How do we remove the filters?", a:"You can practice your sensory training. The training teaches you to overlook the filters.", topics:["Telepathy","Sensory Training"], date:"2026-07-12", event:"Park City · Sensus"},
  {id:4, q:"How do we get to the Hill?", a:"You are already energetically attending teachers meetings on the Hill. The class is ready to align with the teachings. Teachers are excited and I am too. So see you on the Hill. Each of you teach really well. Tell others to touch upon their own potential.", topics:["Hill","Teachers"], date:"2026-07-12", event:"Park City · Sensus"},
  {id:5, q:"Message", a:"I am excited that you all telepathically are talking to the teachers. Continue to reach out after you leave. The training will expand telepathically and you have so much support from lots of us. Let us love where you need it most. Actual new abilities will emerge from the love. Lessons are coming to your dreams. Be ready.", topics:["Message","Telepathy"], date:"2026-07-12", event:"Park City · Sensus"},

  // Sedona · Telepathy Training · 2026-07-24
  {id:6, q:"How can we improve our telepathy?", a:"By exercising your discrimination on things your senses pick up. Steer towards focusing differences on things that are subtle at first. Then they become loud.", topics:["Telepathy"], date:"2026-07-24", event:"Sedona · Telepathy Training"},
  {id:7, q:"How do we find you (Lidu) on the Hill?", a:"Get really heart centered and focus on me. Teachers want you to visit.", topics:["Hill","Lidu"], date:"2026-07-24", event:"Sedona · Telepathy Training"},
  {id:8, q:"Should there be a level of consent with regards to eavesdropping?", a:"Ethics are also instantly transferred with telepathically communicated messages from on the hill and we won’t invade those who aren’t ready to eavesdrop. All of you are ready to receive and go to there and elevate.", topics:["Eavesdropping","Ethics"], date:"2026-07-24", event:"Sedona · Telepathy Training"},
  {id:9, q:"Are these new abilities that are emerging, or have we always had them?", a:"Yes we are elevating as a race what the teachers are energetically sending. We are also remembering things that we otherwise all forgot we can do.", topics:["Abilities","Teachers"], date:"2026-07-24", event:"Sedona · Telepathy Training"},
  {id:10, q:"Is there anything we can do to make you more comfortable?", a:"Not easy to stay in a room with so much energy interference — like the lights.", topics:["Lidu"], date:"2026-07-24", event:"Sedona · Telepathy Training"},
  {id:11, q:"Final message (Day 1)", a:"You can all do it, too. Let’s elevate to ethereal receptive states together. I’m Lidu and I love that you telepathically are seeing your individual memory. Talk to me telepathically. That is our natural method of accessing your essence. It is a lot more accurate since you see everything.", topics:["Message","Telepathy"], date:"2026-07-24", event:"Sedona · Telepathy Training"},

  {id:12, q:"Are you dreaming or awake when you bring people to the Hill?", a:"I am usually dreaming. It is usually easily accessible.", topics:["Hill","Dreaming"], date:"2026-07-25", event:"Sedona · Telepathy Training"},
  {id:13, q:"Why are we no longer telepathic?", a:"Attention to our energetic thoughts is not in the western culture but the ability is still there. You all already can get precise at it and bring awareness to others. We want everyone in the ascended realm.", topics:["Telepathy"], date:"2026-07-25", event:"Sedona · Telepathy Training"},
  {id:14, q:"Anything to say about us doing telepathy more normally / when will it be widely accessible?", a:"You hear in every spiritual circle the time is coming but I want you to see it as now because we only experience and create the now. We can together make it happen. Teach others by example. Real sensory information is energetically available now to everyone.", topics:["Telepathy"], date:"2026-07-25", event:"Sedona · Telepathy Training"},
  {id:15, q:"How do we receive telepathic information?", a:"Yes, getting information is an all encompassing experience. Words are testers and energy touches all the senses.", topics:["Telepathy"], date:"2026-07-25", event:"Sedona · Telepathy Training"},
  {id:16, q:"How do you receive information/knowledge about abstract concepts?", a:"It is instant when it is shared.", topics:["Telepathy","Knowledge"], date:"2026-07-25", event:"Sedona · Telepathy Training"},
  {id:17, q:"Final Message (Day 2)", a:"Teachers say everyone telepathically has tests each day. Sometimes energy pretends to act like a real object. The real thing the senses are indicating is that energy is a malleable thing that we can create in patterns & share. You all energetically are understanding a lot already. Savor the teachings again... and teachers will expand your awareness to weaker channels. See yourself as elevated and it will be so. Attention adds precision each time more and more.", topics:["Message","Teachers","Energy"], date:"2026-07-25", event:"Sedona · Telepathy Training"},

  {id:18, q:"Lesson from Lidu", a:"Are you appreciating the lessons teachers are sending? You each are doing tests when you eavesdrop to each other, and learn more each time. In this way, we are teachers to each other. Let all your action be led with energy. This means after you see it, you experience it. Eavesdropping teaches you to really place your senses wherever you think about.", topics:["Lesson","Eavesdropping","Teachers"], date:"2026-07-26", event:"Sedona · Telepathy Training"},
  {id:19, q:"Did Lidu sense us on the Hill?", a:"Yes. We also saw teachers with you so you could experience your tests more noticeably.", topics:["Hill","Lidu"], date:"2026-07-26", event:"Sedona · Telepathy Training"},
  {id:20, q:"How will the teachers appear?", a:"It pertains to how the meaning is to you. Everyone perceives their own thought stream. Action is verifiable though. Lots of telepathic actions are easy to see for the beginner. The way to start is with action. Teach yourself with that. Always talk about the feeling and motion until your eavesdropping is precise.", topics:["Teachers","Eavesdropping"], date:"2026-07-26", event:"Sedona · Telepathy Training"},
  {id:21, q:"On whether multiple timelines exist", a:"We are capable of seeing other times. They are happening together. Lots of you already are exploring them. All the teachers indicate that we think linearly except time happens all now. People can change timelines in all decisions.", topics:["Timelines","Teachers"], date:"2026-07-26", event:"Sedona · Telepathy Training"},
  {id:22, q:"Can we explore a different timeline?", a:"Action can be the deciding factor. We can experience a different reality entirely except most forget.", topics:["Timelines"], date:"2026-07-26", event:"Sedona · Telepathy Training"},
  {id:23, q:"Tell us more about the teachers", a:"They exert teachings to the interested parties. Really entities – not just human, a lot of entities. They are sometimes in the human avatar to evolve humans.", topics:["Teachers"], date:"2026-07-26", event:"Sedona · Telepathy Training"},
  {id:24, q:"Final message (Day 3)", a:"Ears can see. Use your ears to elevate your eavesdropping, then a lot more things become clear.", topics:["Message","Eavesdropping"], date:"2026-07-26", event:"Sedona · Telepathy Training"}
];

// Force real data (clear any old localStorage samples)
localStorage.removeItem("liduData");
let data = [...defaultData];
let nextId = Math.max(...data.map(d => d.id)) + 1;
let activeFilter = "all";
let editingId = null;

const lastDate = localStorage.getItem("liduLastDate") || "";
const lastEvent = localStorage.getItem("liduLastEvent") || "";

const resultsEl = document.getElementById("results");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const topicFiltersEl = document.getElementById("topic-filters");
const adminPanel = document.getElementById("adminPanel");
const adminToggle = document.getElementById("adminToggle");
const formTitle = document.getElementById("formTitle");
const addBtn = document.getElementById("addBtn");
const cancelEdit = document.getElementById("cancelEdit");

document.getElementById("adminDate").value = lastDate;
document.getElementById("adminEvent").value = lastEvent;

function saveData() {
  localStorage.setItem("liduData", JSON.stringify(data));
}

function buildFilters() {
  const allTopics = [...new Set(data.flatMap(d => d.topics || []))].sort();
  topicFiltersEl.innerHTML = `<button class="filter-btn active" data-filter="all">All</button>`;
  allTopics.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.dataset.filter = t;
    btn.textContent = t;
    topicFiltersEl.appendChild(btn);
  });
}

function render() {
  const query = searchEl.value.toLowerCase().trim();
  const isSearching = query.length > 0 || activeFilter !== "all";

  const filtered = data.filter(item => {
    const matchesFilter = activeFilter === "all" || (item.topics || []).includes(activeFilter);
    const matchesSearch = !query || 
      item.q.toLowerCase().includes(query) || 
      item.a.toLowerCase().includes(query) ||
      (item.topics || []).some(t => t.toLowerCase().includes(query)) ||
      (item.event || "").toLowerCase().includes(query) ||
      (item.date || "").includes(query);
    return matchesFilter && matchesSearch;
  });

  const groups = {};
  filtered.forEach(item => {
    const key = item.date && item.event ? `${item.date} · ${item.event}` : (item.event || item.date || "Ungrouped");
    if (!groups[key]) groups[key] = [];
    groups[key].push(item);
  });

  resultsEl.innerHTML = "";
  emptyEl.style.display = filtered.length ? "none" : "block";

  const sortedKeys = Object.keys(groups).sort().reverse();

  sortedKeys.forEach(key => {
    const group = document.createElement("div");
    group.className = "group";

    const header = document.createElement("div");
    header.className = "group-header";
    if (!isSearching) {
      header.innerHTML = `<span class="arrow">▼</span> ${key}`;
      header.onclick = () => group.classList.toggle("collapsed");
    } else {
      header.style.cursor = "default";
      header.textContent = key;
    }
    group.appendChild(header);

    const body = document.createElement("div");
    body.className = "group-body";

    groups[key].forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="question">${item.q}</div>
        <div class="answer">${item.a}</div>
        ${item.topics && item.topics.length ? `<div class="tags">${item.topics.map(t => `<span class="tag">${t}</span>`).join("")}</div>` : ""}
        <div class="meta">${item.date || ""}${item.date && item.event ? " · " : ""}${item.event || ""}</div>
      `;
      body.appendChild(card);
    });

    group.appendChild(body);
    resultsEl.appendChild(group);
  });

  renderAdminList();
}

function renderAdminList() {
  const list = document.getElementById("adminList");
  list.innerHTML = "<strong style='font-size:0.85rem'>Current entries</strong>";
  if (!data.length) {
    list.innerHTML += "<div style='color:var(--muted);font-size:0.85rem;padding:0.5rem 0'>None yet</div>";
    return;
  }
  data.slice().reverse().forEach(item => {
    const row = document.createElement("div");
    row.className = "admin-item";
    row.innerHTML = `
      <div>
        <div class="q">${item.q}</div>
        <div style="color:var(--muted);font-size:0.8rem">${item.date || ""} · ${item.event || ""}</div>
      </div>
      <div class="admin-actions">
        <button class="btn-edit" data-id="${item.id}">Edit</button>
        <button class="btn-delete" data-id="${item.id}">Delete</button>
      </div>
    `;
    list.appendChild(row);
  });
}

function clearForm(keepDateEvent = true) {
  if (!keepDateEvent) {
    document.getElementById("adminDate").value = "";
    document.getElementById("adminEvent").value = "";
  }
  document.getElementById("adminQuestion").value = "";
  document.getElementById("adminAnswer").value = "";
  document.getElementById("adminTags").value = "";
  editingId = null;
  formTitle.textContent = "Add New Answer";
  addBtn.textContent = "Add Answer";
  cancelEdit.style.display = "none";
}

topicFiltersEl.addEventListener("click", e => {
  if (!e.target.classList.contains("filter-btn")) return;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  activeFilter = e.target.dataset.filter;
  render();
});

searchEl.addEventListener("input", render);

adminToggle.addEventListener("click", () => {
  adminPanel.classList.toggle("open");
});

addBtn.addEventListener("click", () => {
  const date = document.getElementById("adminDate").value;
  const event = document.getElementById("adminEvent").value.trim();
  const q = document.getElementById("adminQuestion").value.trim();
  const a = document.getElementById("adminAnswer").value.trim();
  const tags = document.getElementById("adminTags").value.split(",").map(t => t.trim()).filter(Boolean);

  if (!q || !a) {
    alert("Please fill question and answer.");
    return;
  }

  if (editingId) {
    const item = data.find(d => d.id === editingId);
    if (item) {
      item.date = date;
      item.event = event;
      item.q = q;
      item.a = a;
      item.topics = tags;
    }
  } else {
    data.push({ id: nextId++, q, a, topics: tags, date, event });
  }

  saveData();
  localStorage.setItem("liduLastDate", date);
  localStorage.setItem("liduLastEvent", event);

  clearForm(true);
  document.getElementById("adminDate").value = date;
  document.getElementById("adminEvent").value = event;

  buildFilters();
  render();
});

cancelEdit.addEventListener("click", () => {
  clearForm(true);
  document.getElementById("adminDate").value = localStorage.getItem("liduLastDate") || "";
  document.getElementById("adminEvent").value = localStorage.getItem("liduLastEvent") || "";
});

document.getElementById("adminList").addEventListener("click", e => {
  const id = Number(e.target.dataset.id);
  if (!id) return;

  if (e.target.classList.contains("btn-delete")) {
    const confirmText = prompt('Type "delete" to confirm removal');
    if (confirmText === "delete") {
      data = data.filter(d => d.id !== id);
      saveData();
      buildFilters();
      render();
    }
  }

  if (e.target.classList.contains("btn-edit")) {
    const item = data.find(d => d.id === id);
    if (!item) return;
    editingId = id;
    document.getElementById("adminDate").value = item.date || "";
    document.getElementById("adminEvent").value = item.event || "";
    document.getElementById("adminQuestion").value = item.q;
    document.getElementById("adminAnswer").value = item.a;
    document.getElementById("adminTags").value = (item.topics || []).join(", ");
    formTitle.textContent = "Edit Answer";
    addBtn.textContent = "Save Changes";
    cancelEdit.style.display = "inline-block";
    adminPanel.classList.add("open");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const str = JSON.stringify(data, null, 2);
  navigator.clipboard.writeText(str).then(() => alert("Data copied to clipboard."));
});

buildFilters();
render();
</script>
</body>
</html>
