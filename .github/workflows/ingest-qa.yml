name: Ingest letterboard entry

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: contains(github.event.issue.body, 'LIDU_ENTRY')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const assoc = context.payload.issue.author_association;
            const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const issue = context.payload.issue;

            async function comment(body) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
            }

            if (!allowed.includes(assoc)) {
              await comment('Only people invited as collaborators on this repo can add letterboard entries this way.');
              return;
            }

            const m = (issue.body || '').match(/<!-- LIDU_ENTRY\s*([\s\S]*?)\s*LIDU_ENTRY -->/);
            if (!m) {
              await comment('Could not find a LIDU_ENTRY block in this issue.');
              return;
            }

            let entry;
            try {
              entry = JSON.parse(m[1]);
            } catch (err) {
              await comment('Entry JSON could not be parsed.');
              return;
            }

            const q = String(entry.q || '').trim();
            const a = String(entry.a || '').trim();
            if (!q || !a) {
              await comment('Question and answer are required.');
              return;
            }

            const path = 'data.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const nextId = Math.max(0, ...data.map(d => Number(d.id) || 0)) + 1;
            data.push({
              id: nextId,
              q,
              a,
              topics: Array.isArray(entry.topics) ? entry.topics : [],
              date: entry.date || '',
              event: entry.event || '',
              location: entry.location || '',
              home: entry.home !== false,
              more: entry.more || ''
            });
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
            core.setOutput('added', '1');
            await comment('Added as entry #' + nextId + '. It will show on the live site after GitHub Pages updates.');
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });

      - name: Commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "Add letterboard entry from #${{ github.event.issue.number }}"
          git push
