name: Sync Google Sheet

on:
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Replace data.json even if the sheet has fewer rows (can delete letters)"
        type: boolean
        default: false
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull sheet into data.json
        env:
          ALLOW_SHRINK: ${{ github.event.inputs.allow_shrink == 'true' && '1' || '' }}
        run: python scripts/sync_sheet.py

      - name: Commit if the list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "Sync letterboard entries from Google Sheet"
          git push
